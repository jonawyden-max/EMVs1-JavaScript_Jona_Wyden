<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taschenrechner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script>
        function appendOperation(operation) {
            document.getElementById('resultatArea').innerHTML += operation;
        }

        function resault(){
    let container = document.getElementById('resultatArea');
    let Resultat = eval(container.innerHTML);
    container.innerHTML = Resultat;
}
    </script>

    <div id="resultatArea">
        
    </div>

    <table>
        <tr>
            <td onclick="appendOperation(7)">7</td>
            <td onclick="appendOperation(8)">8</td>
            <td onclick="appendOperation(9)">9</td>
            <td onclick="appendOperation('/')" class="heighlight">/</td>
        </tr>
        <tr>
            <td onclick="appendOperation(4)">4</td>
            <td onclick="appendOperation(5)">5</td>
            <td onclick="appendOperation(6)">6</td>
            <td onclick="appendOperation('*')" class="heighlight">X</td>
        </tr>
        <tr>
            <td onclick="appendOperation(1)">1</td>
            <td onclick="appendOperation(2)">2</td>
            <td onclick="appendOperation(3)">3</td>
            <td onclick="appendOperation('+')" class="heighlight">+</td>
        </tr>
        <tr>
            <td onclick="appendOperation('.')">,</td>
            <td onclick="appendOperation(0)">0</td>
            <td onclick="resault()" id="resault">=</td>
            <td onclick="appendOperation('-')" class="heighlight">-</td>
        </tr>
    </table>
</body>
</html>
