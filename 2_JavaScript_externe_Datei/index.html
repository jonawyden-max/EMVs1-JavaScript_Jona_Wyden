<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Extern</title>
</head>
<body>
    <script>
        document.write("document.write: Etwas veraltet, nicht mehr nutzen!\n");<!-- Veraltet-->
        
        document.body.innerHTML += "Bersser, aber auch etwas veralter!\n";

        const p = document.createElement("p");
        p.textContent = "So ist es ideal!";
        document.body.append(p);
    </script>
</body>
</html>
